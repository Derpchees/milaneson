[Rainmeter]
Update=1000
AccurateText=1
Group=MilanesonWidgets
ContextTitle=#OpenHub#
ContextAction=[!ActivateConfig "milaneson\Hub" "Hub.ini"]
OnRefreshAction=[!WriteKeyValue Variables #StateKey# 1 "#@#State.inc"][!SetVariable #StateKey# 1 "milaneson\Hub"][!UpdateMeter * "milaneson\Hub"][!Redraw "milaneson\Hub"]
OnCloseAction=[!WriteKeyValue Variables #StateKey# 0 "#@#State.inc"][!SetVariable #StateKey# 0 "milaneson\Hub"][!UpdateMeter * "milaneson\Hub"][!Redraw "milaneson\Hub"]

[Metadata]
Name=Hora y fecha
Author=Derpchees
Version=4.0
Information=Hora y fecha compactas. Parte de la suite milaneson.

[Variables]
@Include=#@#Theme.inc
@Include2=#@#Settings.inc
@Include3=#@#Lang\#Language#.inc
@Include4=#@#Scale.inc
StateKey=ClockOn
W=(100*#S#)
H=(54*#S#)

[MeasureClock]
Measure=Time
Format=[#ClockFmt[#Use24h]]
DynamicVariables=1

[MeasureDate]
Measure=Time
Format=#SmallDateFmt#
FormatLocale=#Locale#

[MeterPanel]
Meter=Shape
Shape=Rectangle (0.5*#S#),(0.5*#S#),(#W#-(1*#S#)),(#H#-(1*#S#)),#Radius# | Fill Color #PanelColor# | StrokeWidth (1*#S#) | Stroke Color #BorderColor#

[MeterClock]
Meter=String
MeasureName=MeasureClock
X=#Pad#
Y=(5*#S#)
FontFace=#DisplayFont#
FontSize=(19*#S#)
FontWeight=600
FontColor=#TextColor#
AntiAlias=1

[MeterDot]
Meter=Shape
X=#Pad#
Y=(37*#S#)
Shape=Ellipse (3*#S#),(3*#S#),(3*#S#) | Fill Color #Accent# | StrokeWidth 0
DynamicVariables=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=(#Pad#+(10*#S#))
Y=(31*#S#)
FontFace=#FontName#
FontSize=(8*#S#)
FontColor=#MutedColor#
AntiAlias=1
