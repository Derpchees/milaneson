Shape=Rectangle (0.5*#S#),(0.5*#S#),(#HubW#-(1*#S#)),(#HubH#-(1*#S#)),(#Radius#+(4*#S#)) | Fill Color #HubColor# | StrokeWidth (1*#S#) | Stroke Color #BorderColor#

[CloseButton]
