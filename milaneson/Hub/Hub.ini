[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!CommandMeasure mLHMCheck "Run"]

[Metadata]
Name=milaneson Hub
Author=Derpchees
Version=2.0
Information=Panel de la suite milaneson: activar widgets, ajustes, idioma, ventana de cada widget y estado de LibreHardwareMonitor.

[Variables]
@Include=#@#Theme.inc
@Include2=#@#Settings.inc
@Include3=#@#State.inc
@Include4=#@#Lang\#Language#.inc
@Include5=#@#Scale.inc
HubW=(290*#S#)
HubH=(704*#S#)
Pad=(16*#S#)
RowH=(32*#S#)
; Página principal
Top=(88*#S#)
Top2=(280*#S#)
Top3=(536*#S#)
; Página de ventana
WTop=(76*#S#)
GridCell=(40*#S#)
GridRow=(22*#S#)
GridX=(#HubW#-#Pad#-#GridCell#*3)
GridY=(402*#S#)
ToggleX=(#HubW#-#Pad#-(34*#S#))
FootY=(#HubH#-#Pad#-(14*#S#))
SegW=(#HubW#-#Pad#*2)
Track0=255,255,255,45
Track1=#Accent#
; Para invertir un 0/1 sin fórmulas: [#Not[#Var]]
Not0=1
Not1=0
; Círculos de color (0-4 fijos, 5 = adaptativo) y selector de idioma
AutoGrad=135 | 255,120,170 ; 0.0 | 190,118,255 ; 0.5 | 130,205,255 ; 1.0
SwX=(156*#S#)
SwStep=(22*#S#)
LangX=(225*#S#)
LangStep=(34*#S#)
; Indicador de LibreHardwareMonitor
DotIdle=255,255,255,90
DotOk=110,231,150,255
DotWarn=255,190,90,255
DotBad=255,110,110,255
LhmDot=#DotIdle#
LhmStart=0
LhmDl=0
LhmUrl=https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/latest
; Estado de navegación (0 = principal, 1 = ventana) y valores que llena Window.lua
Page=0
Target=Clock
TargetName=
WinClickThrough=0
WinDraggable=1
WinKeepOnScreen=1
WinSavePosition=1
WinSnapEdges=1
WinHoverIdx=0
WinZIdx=2
WinAlphaIdx=0
WinMon=0

; ===================== MEDIDAS =====================

[mWin]
Measure=Script
ScriptFile=#@#Scripts\Window.lua
UpdateDivider=-1

[mMonitors]
Measure=SysInfo
SysInfoType=NUM_MONITORS

; Escala de los relojes grandes (limitada a 0.5–3)
[mScale1]
Measure=Calc
Formula=#BigClockScale1#
[mScale1Up]
Measure=Calc
Formula=Clamp(#BigClockScale1#+0.25,0.5,3)
[mScale1Down]
Measure=Calc
Formula=Clamp(#BigClockScale1#-0.25,0.5,3)
[mScale2]
Measure=Calc
Formula=#BigClockScale2#
[mScale2Up]
Measure=Calc
Formula=Clamp(#BigClockScale2#+0.25,0.5,3)
[mScale2Down]
Measure=Calc
Formula=Clamp(#BigClockScale2#-0.25,0.5,3)

; Detección de LibreHardwareMonitor: el script imprime ESTADO|RutaExe|Puerto
[mLHMCheck]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\CheckLHM.ps1" -Port #LHMPort#
State=Hide
OutputType=UTF8
Timeout=30000
FinishAction=[!UpdateMeasureGroup LHM][!UpdateMeter *][!Redraw]

[mLHMPath]
Measure=String
Group=LHM
UpdateDivider=-1
String=[mLHMCheck]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^[^|]*\|([^|]*)\|.*$":"\1"

; Si LHM usa otro puerto, se guarda en Settings.inc y se recargan los widgets
[mLHMPort]
Measure=String
Group=LHM
UpdateDivider=-1
String=[mLHMCheck]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^[^|]*\|[^|]*\|(\d+)\s*$":"\1"
IfMatch=^(?!#LHMPort#$)\d+$
IfMatchAction=[!WriteKeyValue Variables LHMPort "[mLHMPort]" "#@#Settings.inc"][!RefreshGroup MilanesonWidgets][!Refresh]

[mLHMStatus]
Measure=String
Group=LHM
UpdateDivider=-1
String=[mLHMCheck]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^\s*([A-Z]+)\|.*$":"\1"
IfMatchMode=1
IfMatch=^OK$
IfMatchAction=[!SetVariable LhmDot "#DotOk#"][!SetOption lhmTitle Text "#LhmOk#"][!SetOption lhmHint Text "#LhmOkHint# [mLHMPort]"][!SetVariable LhmStart 0][!SetVariable LhmDl 0]
IfMatch2=^AUTH$
IfMatchAction2=[!SetVariable LhmDot "#DotWarn#"][!SetOption lhmTitle Text "#LhmAuth#"][!SetOption lhmHint Text "#LhmAuthHint#"][!SetVariable LhmStart 0][!SetVariable LhmDl 0]
IfMatch3=^NOSENSORS$
IfMatchAction3=[!SetVariable LhmDot "#DotWarn#"][!SetOption lhmTitle Text "#LhmNoSensors#"][!SetOption lhmHint Text "#LhmNoSensorsHint#"][!SetVariable LhmStart 0][!SetVariable LhmDl 0]
IfMatch4=^NOWEB$
IfMatchAction4=[!SetVariable LhmDot "#DotWarn#"][!SetOption lhmTitle Text "#LhmNoWeb#"][!SetOption lhmHint Text "#LhmNoWebHint#"][!SetVariable LhmStart 0][!SetVariable LhmDl 0]
IfMatch5=^STOPPED$
IfMatchAction5=[!SetVariable LhmDot "#DotBad#"][!SetOption lhmTitle Text "#LhmStopped#"][!SetOption lhmHint Text "#LhmStoppedHint#"][!SetVariable LhmStart 1][!SetVariable LhmDl 0]
IfMatch6=^MISSING$
IfMatchAction6=[!SetVariable LhmDot "#DotBad#"][!SetOption lhmTitle Text "#LhmMissing#"][!SetOption lhmHint Text "#LhmMissingHint#"][!SetVariable LhmStart 0][!SetVariable LhmDl 1]

; ===================== ESTILOS =====================

[sMain]
