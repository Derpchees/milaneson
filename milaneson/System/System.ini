[Rainmeter]
Update=1000
AccurateText=1
Group=MilanesonWidgets
ContextTitle=#OpenHub#
ContextAction=[!ActivateConfig "milaneson\Hub" "Hub.ini"]
OnRefreshAction=[!WriteKeyValue Variables #StateKey# 1 "#@#State.inc"][!SetVariable #StateKey# 1 "milaneson\Hub"][!UpdateMeter * "milaneson\Hub"][!Redraw "milaneson\Hub"]
OnCloseAction=[!WriteKeyValue Variables #StateKey# 0 "#@#State.inc"][!SetVariable #StateKey# 0 "milaneson\Hub"][!UpdateMeter * "milaneson\Hub"][!Redraw "milaneson\Hub"]

[Metadata]
Name=Sistema
Author=Derpchees
Version=4.0
Information=Uso y temperatura de CPU y GPU desde LibreHardwareMonitor (servidor web remoto).

[Variables]
@Include=#@#Theme.inc
@Include2=#@#Settings.inc
@Include3=#@#Lang\#Language#.inc
@Include4=#@#Scale.inc
StateKey=SystemOn
W=(180*#S#)
H=(64*#S#)
BarW=(#W#-#Pad#*2)

; Una sola petición a LHM; las medidas hijas leen cada valor.
; Orden en data.json: temp. CPU (Tctl/Tdie en Ryzen, CPU Package en Intel), carga total CPU, temp. GPU Core, carga GPU Core.
[MeasureLHM]
Measure=WebParser
URL=http://localhost:#LHMPort#/data.json
UpdateRate=2
RegExp=(?si)"Text":"(?:Core \(Tctl/Tdie\)|CPU Package)","Min":"[^"]*","Value":"(\d+)[\d.]* \\u00B0C".*?"Text":"CPU Total","Min":"[^"]*","Value":"(\d+)[\d.]* %".*?"Text":"GPU Core","Min":"[^"]*","Value":"(\d+)[\d.]* \\u00B0C".*?"Text":"GPU Core","Min":"[^"]*","Value":"(\d+)[\d.]* %"

[MeasureCPUTemp]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExpSubstitute=1
Substitute="^$":"--"

[MeasureCPUUsage]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=2
RegExpSubstitute=1
Substitute="^$":"--"

[MeasureGPUTemp]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=3
RegExpSubstitute=1
Substitute="^$":"--"

[MeasureGPUUsage]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=4
RegExpSubstitute=1
Substitute="^$":"--"

; Valores numéricos (0–100) para las barras; sin datos = 0
[CalcCPU]
Measure=Calc
Formula=Clamp(MeasureCPUUsage,0,100)

[CalcGPU]
Measure=Calc
Formula=Clamp(MeasureGPUUsage,0,100)

; --- ESTILOS ---

[StyleLabel]
X=#Pad#
FontFace=#FontName#
FontSize=(8*#S#)
FontWeight=600
FontColor=#MutedColor#
AntiAlias=1

[StyleValue]
X=(#W#-#Pad#-(38*#S#))
StringAlign=Right
FontFace=#FontName#
FontSize=(10*#S#)
FontWeight=600
FontColor=#TextColor#
AntiAlias=1

[StyleTemp]
X=(#W#-#Pad#)
StringAlign=Right
FontFace=#FontName#
FontSize=(10*#S#)
FontColor=#MutedColor#
AntiAlias=1

[StyleBar]
X=#Pad#
DynamicVariables=1

; --- DISEÑO ---

[MeterPanel]
Meter=Shape
Shape=Rectangle (0.5*#S#),(0.5*#S#),(#W#-(1*#S#)),(#H#-(1*#S#)),#Radius# | Fill Color #PanelColor# | StrokeWidth (1*#S#) | Stroke Color #BorderColor#

[MeterCPU]
Meter=String
MeterStyle=StyleLabel
Y=(9*#S#)
Text=CPU

[MeterCPUUsage]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPUUsage
Y=(6*#S#)
Text=%1%

[MeterCPUTemp]
Meter=String
MeterStyle=StyleTemp
MeasureName=MeasureCPUTemp
Y=(6*#S#)
Text=%1°

[MeterCPUBar]
Meter=Shape
MeterStyle=StyleBar
Y=(25*#S#)
Shape=Rectangle 0,0,#BarW#,(3*#S#),(1.5*#S#) | Fill Color #SubtleColor# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(#BarW#*[CalcCPU]/100,(3*#S#))),(3*#S#),(1.5*#S#) | Fill Color #Accent# | StrokeWidth 0

[MeterGPU]
Meter=String
MeterStyle=StyleLabel
Y=(36*#S#)
Text=GPU

[MeterGPUUsage]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureGPUUsage
Y=(33*#S#)
Text=%1%

[MeterGPUTemp]
Meter=String
MeterStyle=StyleTemp
MeasureName=MeasureGPUTemp
Y=(33*#S#)
Text=%1°

[MeterGPUBar]
Meter=Shape
MeterStyle=StyleBar
Y=(52*#S#)
Shape=Rectangle 0,0,#BarW#,(3*#S#),(1.5*#S#) | Fill Color #SubtleColor# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(#BarW#*[CalcGPU]/100,(3*#S#))),(3*#S#),(1.5*#S#) | Fill Color #Accent# | StrokeWidth 0
