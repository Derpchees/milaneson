[Rainmeter]
Update=1000
OnRefreshAction=[!ClickThrough 1][!Draggable 0][!ZPos -2][!CommandMeasure mLoop "Run"]
OnCloseAction=[!CommandMeasure mLoop "Kill"]

[Metadata]
Name=Acento adaptativo
Author=Derpchees
Version=1.0
Information=Servicio invisible: toma el color del fondo de pantalla (también animado) y lo aplica como acento a toda la suite. Se activa desde el Hub.

[Variables]
@Include=#@#Theme.inc
@Include2=#@#Settings.inc
NewAccent=#Accent#
NewClockAccent=#ClockAccent#
NewClockText=#ClockText#

; Proceso en segundo plano que captura el fondo y llama a !SetVariable NewAccent
[mLoop]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\Adaptive.ps1" -Config "#CURRENTCONFIG#" -Settings "#@#Settings.inc"
State=Hide
Timeout=-1

; Cuando cambia el color: guardarlo y aplicarlo en vivo a cada widget (sin refrescarlos)
[mApply]
Measure=String
String=#NewAccent#
DynamicVariables=1
OnChangeAction=[!WriteKeyValue Variables Accent "#NewAccent#" "#@#Settings.inc"][!SetVariable Accent "#NewAccent#" "milaneson\Clock"][!UpdateMeter * "milaneson\Clock"][!Redraw "milaneson\Clock"][!SetVariable Accent "#NewAccent#" "milaneson\System"][!UpdateMeter * "milaneson\System"][!Redraw "milaneson\System"][!SetVariable Accent "#NewAccent#" "milaneson\BigClock"][!UpdateMeter * "milaneson\BigClock"][!Redraw "milaneson\BigClock"][!SetVariable Accent "#NewAccent#" "milaneson\BigClock2"][!UpdateMeter * "milaneson\BigClock2"][!Redraw "milaneson\BigClock2"][!SetVariable Accent "#NewAccent#" "milaneson\Music"][!UpdateMeasure * "milaneson\Music"][!UpdateMeter * "milaneson\Music"][!Redraw "milaneson\Music"][!SetVariable Accent "#NewAccent#" "milaneson\Hub"][!SetVariable Track1 "#NewAccent#" "milaneson\Hub"][!UpdateMeter * "milaneson\Hub"][!Redraw "milaneson\Hub"]

; Color de contraste para los relojes grandes (van directamente sobre el fondo)
[mApplyClock]
Measure=String
String=#NewClockAccent#|#NewClockText#
DynamicVariables=1
OnChangeAction=[!WriteKeyValue Variables ClockAccent "#NewClockAccent#" "#@#Settings.inc"][!WriteKeyValue Variables ClockText "#NewClockText#" "#@#Settings.inc"][!SetVariable ClockAccent "#NewClockAccent#" "milaneson\BigClock"][!SetVariable ClockText "#NewClockText#" "milaneson\BigClock"][!UpdateMeter * "milaneson\BigClock"][!Redraw "milaneson\BigClock"][!SetVariable ClockAccent "#NewClockAccent#" "milaneson\BigClock2"][!SetVariable ClockText "#NewClockText#" "milaneson\BigClock2"][!UpdateMeter * "milaneson\BigClock2"][!Redraw "milaneson\BigClock2"]

; Una skin necesita al menos un medidor: punto invisible de 1 px
[Dot]
Meter=Image
W=1
H=1
SolidColor=0,0,0,1
