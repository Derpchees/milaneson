[Rainmeter]
Update=500
AccurateText=1
DynamicWindowSize=1
Group=MilanesonWidgets
ContextTitle=#OpenHub#
ContextAction=[!ActivateConfig "milaneson\Hub" "Hub.ini"]
OnRefreshAction=[!WriteKeyValue Variables #StateKey# 1 "#@#State.inc"][!SetVariable #StateKey# 1 "milaneson\Hub"][!UpdateMeter * "milaneson\Hub"][!Redraw "milaneson\Hub"]
OnCloseAction=[!WriteKeyValue Variables #StateKey# 0 "#@#State.inc"][!SetVariable #StateKey# 0 "milaneson\Hub"][!UpdateMeter * "milaneson\Hub"][!Redraw "milaneson\Hub"]

[Metadata]
Name=Música
Author=Derpchees
Version=4.0
Information=Canción actual y controles en una sola tarjeta (WebNowPlaying). Clic en el texto = abrir Spotify, rueda = volumen, clic derecho = silenciar.

[Variables]
@Include=#@#Theme.inc
@Include2=#@#Settings.inc
@Include3=#@#Lang\#Language#.inc
@Include4=#@#Scale.inc
StateKey=MusicOn
Volume=2
W=(360*#S#)
H=(46*#S#)
CoverSize=(30*#S#)
TextX=(#CoverSize#+(16*#S#))
TextW=(#W#-(160*#S#)-#TextX#)
IconY=(#H#/2-(2*#S#))
LaunchW=(150*#S#)

; --- MEDIDAS ---

[MeasureWebNowPlaying]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Status

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
IfMatch=^$
IfMatchAction=[!HideMeterGroup Playing][!ShowMeterGroup Launch][!UpdateMeter *][!Redraw]
IfNotMatchAction=[!HideMeterGroup Launch][!ShowMeterGroup Playing][!UpdateMeter *][!Redraw]

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist

[MeasureCover]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover
CoverPath=#@#Cover.png

[MeasureProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress

; 0 = detenido, 1 = reproduciendo, 2 = pausado
[MeasurePlayState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
IfCondition=MeasurePlayState = 1
IfTrueAction=[!SetOption MeterPlayIcon Text "[\xE769]"]
IfFalseAction=[!SetOption MeterPlayIcon Text "[\xE768]"]

; 0 = sin repetir, 1 = repetir una, 2 = repetir todo
[MeasureRepeat]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Repeat
DynamicVariables=1
IfConditionMode=1
IfCondition=MeasureRepeat = 0
IfTrueAction=[!SetOption MeterRepeat Text "[\xE8EE]"][!SetOption MeterRepeat FontColor "#MutedColor#"]
IfCondition2=MeasureRepeat = 1
IfTrueAction2=[!SetOption MeterRepeat Text "[\xE8ED]"][!SetOption MeterRepeat FontColor "#Accent#"]
IfCondition3=MeasureRepeat = 2
IfTrueAction3=[!SetOption MeterRepeat Text "[\xE8EE]"][!SetOption MeterRepeat FontColor "#Accent#"]

[MeasureShuffle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Shuffle
DynamicVariables=1
IfConditionMode=1
IfCondition=MeasureShuffle = 0
IfTrueAction=[!SetOption MeterShuffle FontColor "#MutedColor#"]
IfCondition2=MeasureShuffle = 1
IfTrueAction2=[!SetOption MeterShuffle FontColor "#Accent#"]

[MeasureWin7Audio]
Measure=Plugin
Plugin=Win7AudioPlugin

; --- ESTILOS ---

[StyleIcon]
DynamicVariables=1
FontFace=#IconFont#
FontSize=(10*#S#)
FontColor=#MutedColor#
StringAlign=CenterCenter
SolidColor=0,0,0,1
W=(24*#S#)
H=(24*#S#)
Y=#IconY#
AntiAlias=1
Hidden=1

; --- SIN MÚSICA: botón para abrir Spotify ---

[MeterLaunchCard]
Meter=Shape
Group=Launch
Shape=Rectangle (0.5*#S#),(0.5*#S#),(#LaunchW#-(1*#S#)),(#H#-(1*#S#)),#Radius# | Fill Color #PanelColor# | StrokeWidth (1*#S#) | Stroke Color #BorderColor#
LeftMouseUpAction=["spotify:"]
MouseOverAction=[!SetOption MeterLaunchText FontColor "#TextColor#"][!UpdateMeter MeterLaunchText][!Redraw]
MouseLeaveAction=[!SetOption MeterLaunchText FontColor "#MutedColor#"][!UpdateMeter MeterLaunchText][!Redraw]
Hidden=1

[MeterLaunchIcon]
Meter=String
Group=Launch
X=(24*#S#)
Y=(#H#/2)
StringAlign=CenterCenter
FontFace=#IconFont#
FontSize=(13*#S#)
FontColor=#Accent#
AntiAlias=1
DynamicVariables=1
Text=[\xE8D6]
Hidden=1

[MeterLaunchText]
Meter=String
Group=Launch
X=(44*#S#)
Y=(#H#/2)
StringAlign=LeftCenter
FontFace=#FontName#
FontSize=(10*#S#)
FontWeight=600
FontColor=#MutedColor#
AntiAlias=1
Text=#OpenSpotify#
Hidden=1

; --- CON MÚSICA ---

[MeterCard]
Meter=Shape
Group=Playing
Shape=Rectangle (0.5*#S#),(0.5*#S#),(#W#-(1*#S#)),(#H#-(1*#S#)),#Radius# | Fill Color #PanelColor# | StrokeWidth (1*#S#) | Stroke Color #BorderColor#
RightMouseUpAction=[!CommandMeasure "MeasureWin7Audio" "ToggleMute"]
MouseScrollUpAction=[!CommandMeasure "MeasureWin7Audio" "ChangeVolume #Volume#"]
MouseScrollDownAction=[!CommandMeasure "MeasureWin7Audio" "ChangeVolume -#Volume#"]
Hidden=1

[CoverMask]
Meter=Shape
Group=Playing
X=(8*#S#)
Y=((#H#-#CoverSize#)/2)
Shape=Rectangle 0,0,#CoverSize#,#CoverSize#,(6*#S#)
Hidden=1

[Cover]
Meter=Image
Group=Playing
MeasureName=MeasureCover
W=#CoverSize#
H=#CoverSize#
Container=CoverMask
PreserveAspectRatio=2
Hidden=1

[MeterTitle]
Meter=String
Group=Playing
MeasureName=MeasureTitle
X=#TextX#
Y=(5*#S#)
W=#TextW#
H=(17*#S#)
ClipString=1
FontFace=#FontName#
FontSize=(9*#S#)
FontWeight=600
FontColor=#TextColor#
AntiAlias=1
LeftMouseUpAction=["spotify:"]
Hidden=1

[MeterArtist]
Meter=String
Group=Playing
MeasureName=MeasureArtist
X=#TextX#
Y=(20*#S#)
W=#TextW#
H=(15*#S#)
ClipString=1
FontFace=#FontName#
FontSize=(8*#S#)
FontColor=#MutedColor#
AntiAlias=1
LeftMouseUpAction=["spotify:"]
Hidden=1

; Barra de progreso fina bajo el texto y los controles
[MeterProgress]
Meter=Shape
Group=Playing
X=#TextX#
Y=(#H#-(9*#S#))
Shape=Rectangle 0,0,(#W#-#TextX#-#Pad#),(3*#S#),(1.5*#S#) | Fill Color #SubtleColor# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max((#W#-#TextX#-#Pad#)*[MeasureProgress]/100,(3*#S#))),(3*#S#),(1.5*#S#) | Fill Color #Accent# | StrokeWidth 0
DynamicVariables=1
Hidden=1

; Controles (de izquierda a derecha): aleatorio, anterior, play/pausa, siguiente, repetir
[MeterShuffle]
Meter=String
Group=Playing
MeterStyle=StyleIcon
X=(#W#-(142*#S#))
Text=[\xE8B1]
LeftMouseUpAction=[!CommandMeasure "MeasureWebNowPlaying" "Shuffle"]

[MeterPrevious]
Meter=String
Group=Playing
MeterStyle=StyleIcon
X=(#W#-(114*#S#))
FontColor=#TextColor#
Text=[\xE892]
LeftMouseUpAction=[!CommandMeasure "MeasureWebNowPlaying" "Previous"]
MouseOverAction=[!SetOption MeterPrevious FontColor "#Accent#"][!UpdateMeter MeterPrevious][!Redraw]
MouseLeaveAction=[!SetOption MeterPrevious FontColor "#TextColor#"][!UpdateMeter MeterPrevious][!Redraw]

[MeterPlayButton]
Meter=Shape
Group=Playing
X=(#W#-(82*#S#)-(13*#S#))
Y=(#IconY#-(13*#S#))
Shape=Ellipse (13*#S#),(13*#S#),(13*#S#) | Fill Color #TextColor# | StrokeWidth 0
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure "MeasureWebNowPlaying" "PlayPause"]
MouseOverAction=[!SetOption MeterPlayButton Shape "Ellipse (13*#S#),(13*#S#),(13*#S#) | Fill Color #Accent# | StrokeWidth 0"][!UpdateMeter MeterPlayButton][!Redraw]
MouseLeaveAction=[!SetOption MeterPlayButton Shape "Ellipse (13*#S#),(13*#S#),(13*#S#) | Fill Color #TextColor# | StrokeWidth 0"][!UpdateMeter MeterPlayButton][!Redraw]
Hidden=1

[MeterPlayIcon]
Meter=String
Group=Playing
X=(#W#-(82*#S#))
Y=#IconY#
StringAlign=CenterCenter
FontFace=#IconFont#
FontSize=(10*#S#)
FontColor=22,22,26,255
AntiAlias=1
Text=[\xE768]
LeftMouseUpAction=[!CommandMeasure "MeasureWebNowPlaying" "PlayPause"]
Hidden=1

[MeterNext]
Meter=String
Group=Playing
MeterStyle=StyleIcon
X=(#W#-(50*#S#))
FontColor=#TextColor#
Text=[\xE893]
LeftMouseUpAction=[!CommandMeasure "MeasureWebNowPlaying" "Next"]
MouseOverAction=[!SetOption MeterNext FontColor "#Accent#"][!UpdateMeter MeterNext][!Redraw]
MouseLeaveAction=[!SetOption MeterNext FontColor "#TextColor#"][!UpdateMeter MeterNext][!Redraw]

[MeterRepeat]
Meter=String
Group=Playing
MeterStyle=StyleIcon
X=(#W#-(22*#S#))
Text=[\xE8EE]
LeftMouseUpAction=[!CommandMeasure "MeasureRepeat" "Repeat"]
